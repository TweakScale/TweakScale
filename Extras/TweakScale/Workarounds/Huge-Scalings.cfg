// Huge scalings factors for TweakScale
//
// TweakScale scales are "small" because bigger values will induce in a lot of errors on the physics engines,
// because everything there is a `float`. `float`s are problematic because is "resolution" is lower than doubles,
// and this ends up with crafts with errors in the mass (causing really hard to diagnose craft's misbalancing
// out of the blue, assuming the Kraken will not kill it first), with you losing money when recovering them,
// weird trusting on engines, you name it.

// Now... If you really don't mind screwing things - i.e., all you want to do is some screenshots on SandBox,
// and so the savegame is disposable), copy this patch somewhere in your `GameData/__LOCAL/TweakScale/WorkArounds`
// directory (or any other, but it's nice to have these things on a standard place):

// See:
// https://forum.kerbalspaceprogram.com/topic/229115-can-i-delete-tweakscale-and-replace-it-with-tweakscalerescaled/

@SCALETYPE[stack]:FINAL
{
	@scaleFactors = 0.1, 0.3125, 0.625, 0.9375, 1.25, 1.875, 2.5, 3.75, 5.0, 7.5, 10, 20, 50, 100, 200
}

@SCALETYPE[stack_square]:FINAL
{
	@scaleFactors = 0.1, 0.3125, 0.625, 0.9375, 1.25, 1.875, 2.5, 3.75, 5.0, 7.5, 10, 20, 50, 100, 200
}

@SCALETYPE[surface]:FINAL
{
	@scaleFactors = 0.1, 0.5, 1, 2, 4, 8, 16
}

@SCALETYPE[free]:FINAL
{
	@scaleFactors = 10, 50, 100, 200, 400, 800, 1600
}

@SCALETYPE[free_square]:FINAL
{
	@scaleFactors = 10, 50, 100, 200, 400, 800, 1600
}

